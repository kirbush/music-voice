name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platforms;android-30 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Test
        run: python voice/build.py --test
      # The build checks the SHA-256 of every cached file, so a stale or altered cache cannot reach the APK.
      - name: Reuse pinned dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/cache
          key: pinned-dependencies-${{ hashFiles('voice/build.py', 'voice/native/build.py') }}
      - name: Build and verify
        run: python voice/build.py --output MusicVoice-arm64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-voice-arm64-test
          path: MusicVoice-arm64.apk
          if-no-files-found: error
