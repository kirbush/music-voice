name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Android SDK components
        run: |
          sdkmanager --licenses < <(yes) > /dev/null
          sdkmanager --install "platforms;android-30" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test
        run: python voice/build.py --test
      - name: Build and verify
        run: python voice/build.py --output MusicVoice-arm64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music-voice-arm64-test
          path: MusicVoice-arm64.apk
          if-no-files-found: error
